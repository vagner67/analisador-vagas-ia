services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Sem chave => modo offline (palavras-chave + TF-IDF), rotulado nas respostas.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - DEMO_SEED=${DEMO_SEED:-1}
    volumes:
      - vagas-data:/data
volumes:
  vagas-data:
