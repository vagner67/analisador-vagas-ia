[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analisador-vagas-ia"
version = "0.1.0"
description = "CLI e API que analisam vagas de emprego com LLM (Gemini/OpenAI) e geram relatórios SQL."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vagner Pereira" }]
dependencies = ["httpx>=0.27", "fastapi>=0.110"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "ruff>=0.5", "fastapi>=0.110"]

[project.scripts]
analisador-vagas = "analisador_vagas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
analisador_vagas = ["schema.sql", "static/*.html", "dados/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
